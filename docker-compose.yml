services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: bts-ch
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./sql:/sql:ro

volumes:
  ch-data:
